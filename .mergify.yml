merge_queue:
  max_parallel_checks: 1
  mode: serial

queue_rules:
  - name: default
    batch_size: 1
    max_checks_retries: 0
    merge_method: squash
    queue_conditions:
      - base = main
      - label = automated
      - check-success = Pass
    merge_conditions:
      - base = main
      - label = automated
      - check-success = Pass

pull_request_rules:
  - name: queue automated updates
    conditions:
      - base = main
      - label = automated
      - check-success = Pass
    actions:
      queue:
        name: default
  - name: delete merged update branches
    conditions:
      - base = main
      - label = automated
      - merged
    actions:
      delete_head_branch: {}
