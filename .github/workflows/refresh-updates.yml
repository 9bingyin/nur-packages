name: Refresh Updates

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-updates-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Get bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"$GITHUB_OUTPUT"
      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Refresh queue head
        env:
          AUTOMATION_BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_REPOSITORY: ${{ github.workspace }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bun ci/main.ts refresh-update-queue
