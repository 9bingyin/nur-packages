name: Update

on:
  schedule:
    - cron: "0 0,4,18,21 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Specific packages to update, separated by spaces. Empty means all discoverable packages."
        required: false
        default: ""
      inputs:
        description: "Specific flake inputs to update, separated by spaces. Empty means all root inputs."
        required: false
        default: ""

permissions: {}

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      batch-matrix: ${{ steps.discovery.outputs.batch-matrix }}
      has-updates: ${{ steps.discovery.outputs.has-updates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Discover
        id: discovery
        env:
          PACKAGES: ${{ github.event.inputs.packages || '' }}
          INPUTS: ${{ github.event.inputs.inputs || '' }}
        run: bun ci/main.ts discovery

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    name: ${{ matrix.group }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.batch-matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Prepare updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTERNET_ARCHIVE_ACCESS_KEY: ${{ secrets.INTERNET_ARCHIVE_ACCESS_KEY }}
          INTERNET_ARCHIVE_SECRET_KEY: ${{ secrets.INTERNET_ARCHIVE_SECRET_KEY }}
          UPDATE_BATCH: ${{ toJSON(matrix.targets) }}
          UPDATE_BATCH_DIR: ${{ runner.temp }}/update-batch
          UPDATE_CONCURRENCY: "4"
          UPDATE_WORKTREE_DIR: ${{ runner.temp }}/update-worktrees
        run: bun ci/main.ts prepare-update-batch
      - name: Upload updates
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/update-batch
          retention-days: 3
          if-no-files-found: warn

  publish:
    needs:
      - discover
      - update
    if: always() && needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download updates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: update-batch-*
          path: ${{ runner.temp }}/update-batch
          merge-multiple: true
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Inspect updates
        id: update
        env:
          UPDATE_BATCH_DIR: ${{ runner.temp }}/update-batch
        run: bun ci/main.ts inspect-update-batch
      - name: Create bot token
        if: steps.update.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Get bot user
        if: steps.update.outputs.changed == 'true'
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"$GITHUB_OUTPUT"
      - name: Configure git
        if: steps.update.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Publish updates
        if: steps.update.outputs.changed == 'true'
        env:
          AUTOMATION_BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_LABELS: "dependencies,automated"
          UPDATE_BATCH_DIR: ${{ runner.temp }}/update-batch
        run: bun ci/main.ts publish-update-batch

  summary:
    needs:
      - discover
      - update
      - publish
    if: always() && needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Update"
            echo
            echo "- Discovery: \`${{ needs.discover.result }}\`"
            echo "- Update batches: \`${{ needs.update.result }}\`"
            echo "- Publish: \`${{ needs.publish.result }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
