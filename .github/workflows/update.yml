name: Update

on:
  schedule:
    - cron: "0 0,4,18,21 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Specific packages to update, separated by spaces. Empty means every package with an update script."
        required: false
        default: ""

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  lock:
    name: Lock Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nix Setup
        uses: ./.github/actions/setup-nix
      - name: Lock Update
        uses: ./.github/actions/lock-update
        with:
          app_client_id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

  package:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nix Setup
        uses: ./.github/actions/setup-nix
      - name: Package Update
        uses: ./.github/actions/package-update
        with:
          app_client_id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          app_private_key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          internet_archive_access_key: ${{ secrets.INTERNET_ARCHIVE_ACCESS_KEY }}
          internet_archive_secret_key: ${{ secrets.INTERNET_ARCHIVE_SECRET_KEY }}
          packages: ${{ github.event.inputs.packages || '' }}
          system: ${{ matrix.system }}
