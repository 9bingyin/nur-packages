name: PR

on:
  pull_request_target:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-branch: ${{ steps.prepare.outputs.baseBranch }}
      files: ${{ steps.prepare.outputs.files }}
      head-branch: ${{ steps.prepare.outputs.headBranch }}
      head-sha: ${{ steps.prepare.outputs.headSha }}
      merged-repository: ${{ steps.prepare.outputs.mergedRepository }}
      merged-sha: ${{ steps.prepare.outputs.mergedSha }}
      systems: ${{ steps.prepare.outputs.systems }}
      target-sha: ${{ steps.prepare.outputs.targetSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - id: prepare
        name: Prepare pull request refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ci/main.ts prepare-pr

  lint:
    name: Lint
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
    with:
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  eval:
    name: Eval
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/eval.yml
    with:
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      systems: ${{ needs.prepare.outputs.systems }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  unlock:
    name: Required checks
    if: always()
    needs:
      - lint
      - eval
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Publish aggregate status
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: bun ci/main.ts publish-status
