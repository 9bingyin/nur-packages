name: PR

on:
  pull_request_target:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base-branch: ${{ steps.prepare.outputs.baseBranch }}
      files: ${{ steps.prepare.outputs.files }}
      head-branch: ${{ steps.prepare.outputs.headBranch }}
      head-sha: ${{ steps.prepare.outputs.headSha }}
      matrix: ${{ steps.prepare.outputs.matrix }}
      merged-repository: ${{ steps.prepare.outputs.mergedRepository }}
      merged-sha: ${{ steps.prepare.outputs.mergedSha }}
      systems: ${{ steps.prepare.outputs.systems }}
      target-sha: ${{ steps.prepare.outputs.targetSha }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Prepare
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun ci/main.ts prepare-pr

  check:
    name: Check
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
    with:
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  lint:
    name: Lint
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml
    with:
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  eval:
    name: Eval
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/eval.yml
    with:
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      systems: ${{ needs.prepare.outputs.systems }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}

  review:
    name: Review
    needs:
      - prepare
      - check
      - lint
      - eval
      - build
    permissions:
      contents: read
    uses: ./.github/workflows/review.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      merged-repository: ${{ needs.prepare.outputs.merged-repository }}
      merged-sha: ${{ needs.prepare.outputs.merged-sha }}
      target-sha: ${{ needs.prepare.outputs.target-sha }}

  unlock:
    name: unlock
    if: always()
    needs:
      - check
      - lint
      - eval
      - build
      - review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Unlock
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: bun ci/main.ts publish-status
