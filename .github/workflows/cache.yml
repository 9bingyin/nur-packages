name: Cache

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      matrix:
        required: true
        type: string
      review-run-id:
        required: true
        type: number
      trusted-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cache:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.trusted-sha }}
          path: trusted
      - name: Download cache bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: review-cache-${{ matrix.system }}
          path: cache-bundle
          repository: ${{ github.repository }}
          run-id: ${{ inputs.review-run-id }}
          github-token: ${{ github.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Configure cache
        uses: Mic92/niks3-action@1599f31edad5e2a726e9ff1efe726847a8ebd2f4 # v1
        with:
          server-url: https://niks3.bingyin.org
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Upload cache
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun trusted/ci/main.ts cache-upload \
            --bundle cache-bundle \
            --repository trusted \
            --system "$SYSTEM" \
            --output "cache-$SYSTEM.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-${{ matrix.system }}
          path: cache-${{ matrix.system }}.json
