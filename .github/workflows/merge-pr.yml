name: Merge PR

on:
  workflow_run:
    workflows:
      - PR
    types:
      - completed

permissions: {}

concurrency:
  group: merge-pr-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  policy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      base-sha: ${{ steps.policy.outputs.baseSha }}
      head-sha: ${{ steps.policy.outputs.headSha }}
      mode: ${{ steps.policy.outputs.mode }}
      pull-request-number: ${{ steps.policy.outputs.pullRequestNumber }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Create bot identity token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Get bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"$GITHUB_OUTPUT"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Select merge policy
        id: policy
        env:
          AUTOMATION_BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          CANDIDATE_REPOSITORY: ${{ runner.temp }}/candidate
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bun ci/main.ts merge-policy

  auto:
    name: auto
    needs: policy
    if: needs.policy.outputs.mode == 'auto'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Enable auto-merge
        env:
          BASE_SHA: ${{ needs.policy.outputs.base-sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ needs.policy.outputs.head-sha }}
          PULL_REQUEST_NUMBER: ${{ needs.policy.outputs.pull-request-number }}
        run: bun ci/main.ts merge

  summary:
    needs:
      - policy
      - auto
    if: always() && needs.policy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Merge policy"
            echo
            echo "- Mode: \`${{ needs.policy.outputs.mode }}\`"
            echo "- Pull request: \`#${{ needs.policy.outputs.pull-request-number }}\`"
            echo "- Auto-merge: \`${{ needs.auto.result }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
