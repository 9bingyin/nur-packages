name: Build Cache

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "51 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-cache-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci/systems.json
      - name: Matrix
        id: matrix
        run: |
          echo "matrix=$(jq -c '{include: .}' ci/systems.json)" >>"$GITHUB_OUTPUT"

  cache:
    needs: prepare
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: binary-cache-auto
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
            extra-substituters = https://cache.bingyin.org
            extra-trusted-public-keys = cache.bingyin.org-1:PU5qCuJfhYPKSIRdOMCndVB6Dn9rRRIRVZAnG2uAPSI=
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Install cache tools
        run: |
          nix_fast_build=$(nix build \
            --no-link \
            --print-out-paths \
            github:Mic92/nix-fast-build/d5a820b15111cf70b2eb1fef94a4d65ded1a555f#default)
          niks3=$(nix build \
            --inputs-from . \
            --no-link \
            --print-out-paths \
            nixpkgs#niks3)
          echo "$nix_fast_build/bin" >>"$GITHUB_PATH"
          echo "$niks3/bin" >>"$GITHUB_PATH"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Build uncached packages
        env:
          NIKS3_SERVER: https://niks3.bingyin.org
          NIXPKGS_ALLOW_UNFREE: "1"
          SYSTEM: ${{ matrix.system }}
        run: |
          bun ci/main.ts build-cache \
            --repository . \
            --system "$SYSTEM" \
            --output "cache-$SYSTEM.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-main-${{ matrix.system }}
          path: cache-${{ matrix.system }}.json
          if-no-files-found: ignore
