name: Build Cache

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: ci/systems.json
      - name: Matrix
        id: matrix
        run: |
          echo "matrix=$(jq -c '{include: .}' ci/systems.json)" >>"$GITHUB_OUTPUT"

  cache:
    needs: prepare
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: binary-cache-auto
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout current
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: current
      - name: Checkout previous
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.before }}
          path: previous
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Configure cache
        uses: Mic92/niks3-action@1599f31edad5e2a726e9ff1efe726847a8ebd2f4 # v1
        with:
          server-url: https://niks3.bingyin.org
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Evaluate changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun current/ci/main.ts eval-packages \
            --target previous \
            --merged current \
            --system "$SYSTEM" \
            --output "eval-$SYSTEM.json"
      - name: Build changed paths
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun current/ci/main.ts build-cache-result \
            --result "eval-$SYSTEM.json" \
            --repository current \
            --system "$SYSTEM" \
            --output "cache-$SYSTEM.json"
      - name: Build all paths
        if: github.event_name != 'push' || github.event.before == '0000000000000000000000000000000000000000'
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun current/ci/main.ts build-cache-all \
            --repository current \
            --system "$SYSTEM" \
            --output "cache-$SYSTEM.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cache-main-${{ matrix.system }}
          path: cache-${{ matrix.system }}.json
