name: Review

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merged-repository:
        required: true
        type: string
      merged-sha:
        required: true
        type: string
      target-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  review:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Download comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: comparison
          path: comparison
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.bingyin.org
            extra-trusted-public-keys = cache.bingyin.org-1:PU5qCuJfhYPKSIRdOMCndVB6Dn9rRRIRVZAnG2uAPSI=
            sandbox = true
            allow-import-from-derivation = false
      - name: Reject flake-supplied Nix config
        run: echo 'accept-flake-config = false' >> "${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Review
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun trusted/ci/main.ts review \
            --comparison comparison/eval-comparison.json \
            --repository untrusted \
            --system "$SYSTEM" \
            --output "review-$SYSTEM.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: review-${{ matrix.system }}
          path: review-${{ matrix.system }}.json
