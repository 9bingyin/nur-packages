name: Eval

on:
  workflow_call:
    inputs:
      merged-repository:
        required: true
        type: string
      merged-sha:
        required: true
        type: string
      systems:
        required: true
        type: string
      target-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  flake:
    name: Flake outputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Set up Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Evaluate all flake outputs
        run: |
          nix flake check \
            --all-systems \
            --no-build \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option allow-import-from-derivation false \
            "path:$GITHUB_WORKSPACE/untrusted"

  packages:
    name: Packages (${{ matrix.system }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    steps:
      - name: Checkout trusted target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Checkout untrusted merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Set up Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Compare package output paths
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun trusted/ci/main.ts eval-packages \
            --target trusted \
            --merged untrusted \
            --system "$SYSTEM" \
            --output "eval-$SYSTEM.json"
