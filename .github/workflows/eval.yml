name: Eval

on:
  workflow_call:
    inputs:
      base-branch:
        required: true
        type: string
      head-branch:
        required: true
        type: string
      head-repository:
        required: true
        type: string
      head-repository-id:
        required: true
        type: number
      head-sha:
        required: true
        type: string
      mergeable:
        required: true
        type: boolean
      merged-repository:
        required: true
        type: string
      merged-sha:
        required: true
        type: string
      pull-request-number:
        required: true
        type: number
      systems:
        required: true
        type: string
      target-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  misc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Evaluate flake
        run: |
          nix flake check \
            --all-systems \
            --no-build \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option allow-import-from-derivation false \
            "path:$GITHUB_WORKSPACE/untrusted"

  eval:
    name: ${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Evaluate packages
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun trusted/ci/main.ts eval-packages \
            --target trusted \
            --merged untrusted \
            --system "$SYSTEM" \
            --output "eval-$SYSTEM.json"
      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-${{ matrix.system }}
          path: eval-${{ matrix.system }}.json

  compare:
    needs: eval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: eval-*
          path: eval
          merge-multiple: true
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Compare
        env:
          BASE_BRANCH: ${{ inputs.base-branch }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          HEAD_REPOSITORY: ${{ inputs.head-repository }}
          HEAD_REPOSITORY_ID: ${{ inputs.head-repository-id }}
          HEAD_SHA: ${{ inputs.head-sha }}
          MERGEABLE: ${{ inputs.mergeable }}
          MERGED_REPOSITORY: ${{ inputs.merged-repository }}
          MERGED_SHA: ${{ inputs.merged-sha }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull-request-number }}
          TARGET_SHA: ${{ inputs.target-sha }}
        run: |
          jq -n \
            --arg baseBranch "$BASE_BRANCH" \
            --arg baseSha "$TARGET_SHA" \
            --arg headBranch "$HEAD_BRANCH" \
            --arg headRepository "$HEAD_REPOSITORY" \
            --argjson headRepositoryId "$HEAD_REPOSITORY_ID" \
            --arg headSha "$HEAD_SHA" \
            --argjson mergeable "$MERGEABLE" \
            --arg mergedRepository "$MERGED_REPOSITORY" \
            --arg mergedSha "$MERGED_SHA" \
            --argjson pullRequestNumber "$PULL_REQUEST_NUMBER" \
            --argjson repositoryId "$GITHUB_REPOSITORY_ID" \
            --argjson repositoryOwnerId "$GITHUB_REPOSITORY_OWNER_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg targetSha "$TARGET_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
            '{
              baseBranch: $baseBranch,
              baseSha: $baseSha,
              headBranch: $headBranch,
              headRepository: $headRepository,
              headRepositoryId: $headRepositoryId,
              headSha: $headSha,
              mergeable: $mergeable,
              mergedRepository: $mergedRepository,
              mergedSha: $mergedSha,
              pullRequestNumber: $pullRequestNumber,
              repositoryId: $repositoryId,
              repositoryOwnerId: $repositoryOwnerId,
              runAttempt: $runAttempt,
              runId: $runId,
              targetSha: $targetSha,
              workflowRef: $workflowRef,
              workflowSha: $workflowSha
            }' >revision.json
          bun trusted/ci/main.ts eval-compare \
            --input eval \
            --output eval-comparison.json \
            --revision revision.json
      - name: Upload comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparison
          path: eval-comparison.json
