name: Update Dependencies

on:
  schedule:
    - cron: "0 0,4,18,21 * * *"
  workflow_dispatch:
    inputs:
      packages:
        description: "Specific packages to update, separated by spaces. Empty means all discoverable packages."
        required: false
        default: ""
      inputs:
        description: "Specific flake inputs to update, separated by spaces. Empty means all root inputs."
        required: false
        default: ""

permissions: {}

concurrency:
  group: update-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discovery.outputs.matrix }}
      has-updates: ${{ steps.discovery.outputs.has-updates }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ github.token }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Discover
        id: discovery
        env:
          PACKAGES: ${{ github.event.inputs.packages || '' }}
          INPUTS: ${{ github.event.inputs.inputs || '' }}
        run: bun ci/main.ts discovery

  update:
    needs: discover
    if: needs.discover.outputs.has-updates == 'true'
    name: ${{ matrix.group }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Prepare update
        env:
          INTERNET_ARCHIVE_ACCESS_KEY: ${{ matrix.requires_internet_archive && secrets.INTERNET_ARCHIVE_ACCESS_KEY || '' }}
          INTERNET_ARCHIVE_SECRET_KEY: ${{ matrix.requires_internet_archive && secrets.INTERNET_ARCHIVE_SECRET_KEY || '' }}
          NIXPKGS_ALLOW_UNFREE: "1"
          NIX_UPDATE_SYSTEM: ${{ matrix.system }}
          UPDATE_ARTIFACT_DIR: ${{ runner.temp }}/update-artifact
          UPDATE_TARGET: ${{ toJSON(matrix.target) }}
          UPDATE_TYPE: ${{ matrix.type }}
        run: bun ci/main.ts prepare-update
      - name: Upload update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/update-artifact
          retention-days: 3

  publish:
    needs:
      - discover
      - update
    if: always() && needs.discover.outputs.has-updates == 'true'
    name: publish-${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Download update
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/update-artifact
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write
      - name: Get bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"$GITHUB_OUTPUT"
      - name: Configure git
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
      - name: Publish update
        env:
          AUTOMATION_BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_LABELS: "dependencies,automated"
          UPDATE_ARTIFACT_DIR: ${{ runner.temp }}/update-artifact
        run: bun ci/main.ts publish-update

  summary:
    needs:
      - discover
      - update
      - publish
    if: always() && needs.discover.outputs.has-updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## Update"
            echo
            echo "- Discovery: \`${{ needs.discover.result }}\`"
            echo "- Update: \`${{ needs.update.result }}\`"
            echo "- Publish: \`${{ needs.publish.result }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
