name: Check

on:
  workflow_call:
    inputs:
      source-artifact-id:
        required: true
        type: string
      merged-sha:
        required: true
        type: string
      target-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Download checked source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ inputs.source-artifact-id }}
          path: source
          merge-multiple: true
      - name: Checkout checked source
        env:
          MERGED_SHA: ${{ inputs.merged-sha }}
        run: |
          git clone --no-checkout source/pr-source.bundle untrusted
          git -C untrusted checkout --detach "$MERGED_SHA"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install trusted dependencies
        working-directory: trusted
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Link trusted dependencies
        run: ln -s "$GITHUB_WORKSPACE/trusted/node_modules" "$GITHUB_WORKSPACE/untrusted/node_modules"
      - name: Check CI
        run: |
          bun trusted/node_modules/typescript/bin/tsc \
            --project untrusted/ci/tsconfig.json
          bun test untrusted/ci/ci_test.ts
