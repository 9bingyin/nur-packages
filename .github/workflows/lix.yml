name: Lix

on:
  workflow_call:
    inputs:
      merged-repository:
        required: true
        type: string
      merged-sha:
        required: true
        type: string
      systems:
        required: true
        type: string
      target-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  misc:
    name: misc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Prepare Lix
        run: |
          lix_program=$(nix eval --raw \
            "path:$GITHUB_WORKSPACE/trusted#apps.x86_64-linux.lix.program")
          lix_store=${lix_program%/bin/nix}
          nix-store --realise "$lix_store"
          echo "$lix_store/bin" >>"$GITHUB_PATH"
      - name: Evaluate flake with Lix
        run: |
          nix --version | grep -F Lix
          nix flake check \
            --all-systems \
            --no-build \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option allow-import-from-derivation false \
            "path:$GITHUB_WORKSPACE/untrusted"

  eval:
    name: ${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.systems) }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target-sha }}
          path: trusted
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true
            allow-import-from-derivation = false
            accept-flake-config = false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Evaluate with Nix
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          bun trusted/ci/main.ts eval-snapshot \
            --repository untrusted \
            --system "$SYSTEM" \
            --output "nix-eval-$SYSTEM.json"
      - name: Prepare Lix
        run: |
          lix_program=$(nix eval --raw \
            "path:$GITHUB_WORKSPACE/trusted#apps.x86_64-linux.lix.program")
          lix_store=${lix_program%/bin/nix}
          nix-store --realise "$lix_store"
          echo "$lix_store/bin" >>"$GITHUB_PATH"
      - name: Evaluate with Lix
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix --version | grep -F Lix
          bun trusted/ci/main.ts eval-snapshot \
            --repository untrusted \
            --system "$SYSTEM" \
            --output "lix-eval-$SYSTEM.json"
          bun trusted/ci/main.ts lix \
            --nix "nix-eval-$SYSTEM.json" \
            --lix "lix-eval-$SYSTEM.json" \
            --system "$SYSTEM"
      - name: Upload Lix evaluation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lix-eval-${{ matrix.system }}
          path: |
            nix-eval-${{ matrix.system }}.json
            lix-eval-${{ matrix.system }}.json
