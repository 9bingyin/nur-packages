name: Build

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      merged-repository:
        required: true
        type: string
      merged-sha:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Checkout untrusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ inputs.merged-repository }}
          ref: ${{ inputs.merged-sha }}
          path: untrusted
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: |
            extra-substituters = https://cache.bingyin.org
            extra-trusted-public-keys = cache.bingyin.org-1:PU5qCuJfhYPKSIRdOMCndVB6Dn9rRRIRVZAnG2uAPSI=
            sandbox = true
            allow-import-from-derivation = false
      - name: Reject flake-supplied Nix config
        run: echo 'accept-flake-config = false' >> "${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
      - name: Build CI outputs
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix build \
            --no-link \
            --keep-going \
            --no-write-lock-file \
            --option accept-flake-config false \
            --option allow-import-from-derivation false \
            "path:$GITHUB_WORKSPACE/untrusted#formatter.$SYSTEM" \
            "path:$GITHUB_WORKSPACE/untrusted#checks.$SYSTEM.meta-maintainers" \
            "path:$GITHUB_WORKSPACE/untrusted#checks.$SYSTEM.package-metadata"
