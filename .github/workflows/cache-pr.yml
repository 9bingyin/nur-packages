name: Cache PR

on:
  workflow_run:
    workflows:
      - PR
    types:
      - completed

permissions: {}

concurrency:
  group: cache-pr-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      base-sha: ${{ steps.gate.outputs.baseSha }}
      head-sha: ${{ steps.gate.outputs.headSha }}
      matrix: ${{ steps.gate.outputs.matrix }}
      merged-repository: ${{ steps.gate.outputs.mergedRepository }}
      merged-sha: ${{ steps.gate.outputs.mergedSha }}
      mode: ${{ steps.gate.outputs.mode }}
      pull-request-number: ${{ steps.gate.outputs.pullRequestNumber }}
      review-run-id: ${{ steps.gate.outputs.reviewRunId }}
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download comparison
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: comparison
          path: comparison
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: read
      - name: Get bot user
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >>"$GITHUB_OUTPUT"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Gate
        id: gate
        env:
          AUTOMATION_BOT_USER_ID: ${{ steps.bot-user.outputs.id }}
          CANDIDATE_REPOSITORY: ${{ runner.temp }}/candidate
          COMPARISON_FILE: comparison/eval-comparison.json
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: bun ci/main.ts cache-gate

  cache-auto:
    name: Cache Auto
    needs: gate
    if: needs.gate.outputs.mode == 'auto'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cache.yml
    with:
      environment: binary-cache-auto
      matrix: ${{ needs.gate.outputs.matrix }}
      review-run-id: ${{ fromJSON(needs.gate.outputs.review-run-id) }}
      trusted-sha: ${{ needs.gate.outputs.base-sha }}

  cache-manual:
    name: Cache Manual
    needs: gate
    if: needs.gate.outputs.mode == 'manual'
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cache.yml
    with:
      environment: binary-cache-manual
      matrix: ${{ needs.gate.outputs.matrix }}
      review-run-id: ${{ fromJSON(needs.gate.outputs.review-run-id) }}
      trusted-sha: ${{ needs.gate.outputs.base-sha }}

  merge:
    name: merge
    needs:
      - gate
      - cache-auto
      - cache-manual
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      ((needs.gate.outputs.mode == 'auto' && needs.cache-auto.result == 'success') ||
       (needs.gate.outputs.mode == 'manual' && needs.cache-manual.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.base-sha }}
          sparse-checkout: ci
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - name: Merge
        env:
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
          MERGED_SHA: ${{ needs.gate.outputs.merged-sha }}
          PULL_REQUEST_NUMBER: ${{ needs.gate.outputs.pull-request-number }}
        run: bun ci/main.ts merge
