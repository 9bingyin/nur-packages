name: Nix Setup
description: Install Nix with the repository binary cache
runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          extra-substituters = https://cache.bingyin.org
          extra-trusted-public-keys = cache.bingyin.org-1:PU5qCuJfhYPKSIRdOMCndVB6Dn9rRRIRVZAnG2uAPSI=
          experimental-features = nix-command flakes
          sandbox = true
          allow-import-from-derivation = false
          accept-flake-config = false
