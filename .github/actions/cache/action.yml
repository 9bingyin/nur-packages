name: Cache
description: Build uncached packages and upload them to niks3
inputs:
  system:
    description: Nix system to build
    required: true
runs:
  using: composite
  steps:
    - name: Build uncached packages
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NIKS3_SERVER: https://niks3.bingyin.org
        NIXPKGS_ALLOW_UNFREE: "1"
        SYSTEM: ${{ inputs.system }}
      run: ./.github/scripts/cache.ts
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: cache-${{ inputs.system }}
        path: cache-${{ inputs.system }}.json
        if-no-files-found: ignore
