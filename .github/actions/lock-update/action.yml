name: Lock Update
description: Update flake inputs and open a pull request
inputs:
  app_client_id:
    description: Automation GitHub App client id
    required: true
  app_private_key:
    description: Automation GitHub App private key
    required: true
runs:
  using: composite
  steps:
    - name: Create bot token
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ inputs.app_client_id }}
        private-key: ${{ inputs.app_private_key }}
        permission-contents: write
        permission-pull-requests: write
    - name: Configure git
      id: git
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        bot_user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${bot_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
        gh auth setup-git
    - name: Update lock
      shell: bash
      working-directory: ${{ github.workspace }}
      run: nix flake update
    - name: Open pull request
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BASE_BRANCH: ${{ github.event.repository.default_branch }}
        BOT_NAME: ${{ steps.git.outputs.name }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: ./.github/scripts/lock-update.sh
